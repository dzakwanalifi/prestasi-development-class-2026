<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Prestasi Development Class</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#fff;color:#111;font-family:Arial,Helvetica,sans-serif}main{width:min(440px,calc(100% - 40px))}h1{font-size:36px;line-height:1.1;margin:0 0 16px}p{line-height:1.5}label{display:block;font-size:16px;font-weight:700;margin:32px 0 8px}input{width:100%;padding:14px;font-size:18px;border:3px solid #111;border-radius:0}button{margin-top:16px;width:100%;padding:15px;border:0;background:#ed6900;color:#111;font-size:18px;font-weight:700;cursor:pointer}button:focus-visible,input:focus-visible{outline:3px solid #a43c00;outline-offset:3px}button:disabled{opacity:.7;cursor:wait}#message{min-height:24px;color:#962e00}iframe{position:fixed;inset:0;width:100%;height:100%;border:0;background:#202020}iframe[hidden]{display:none}
</style>
</head>
<body>
<main id="login"><h1>Prestasi Development Class</h1><p>Masukkan password untuk membuka presentasi.</p><form id="form"><label for="password">Password</label><input id="password" type="password" autocomplete="current-password" required autofocus><button id="submit" type="submit">Buka presentasi</button><p id="message" role="status" aria-live="polite"></p></form></main>
<iframe id="presentation" title="Presentasi Prestasi Development Class" allowfullscreen hidden></iframe>
<script>
const form=document.getElementById('form'),password=document.getElementById('password'),button=document.getElementById('submit'),message=document.getElementById('message'),frame=document.getElementById('presentation');
let encrypted;
form.addEventListener('submit',async event=>{
  event.preventDefault();button.disabled=true;message.textContent='Membuka presentasi...';
  try{
    if(!encrypted){const response=await fetch('payload.bin');if(!response.ok)throw new Error('download');encrypted=new Uint8Array(await response.arrayBuffer())}
    const material=await crypto.subtle.importKey('raw',new TextEncoder().encode(password.value),'PBKDF2',false,['deriveKey']);
    const key=await crypto.subtle.deriveKey({name:'PBKDF2',hash:'SHA-256',salt:encrypted.slice(0,16),iterations:600000},material,{name:'AES-GCM',length:256},false,['decrypt']);
    const decrypted=await crypto.subtle.decrypt({name:'AES-GCM',iv:encrypted.slice(16,28)},key,encrypted.slice(28));
    const stream=new Blob([decrypted]).stream().pipeThrough(new DecompressionStream('gzip'));
    const archive=JSON.parse(await new Response(stream).text()),urls={};
    for(const [name,encoded] of Object.entries(archive.assets)){
      const binary=atob(encoded),bytes=new Uint8Array(binary.length);
      for(let i=0;i<binary.length;i++)bytes[i]=binary.charCodeAt(i);
      const type=name.endsWith('.ttf')?'font/ttf':name.toLowerCase().endsWith('.png')?'image/png':'image/jpeg';
      urls[name]=URL.createObjectURL(new Blob([bytes],{type}));
    }
    let html=archive.html.replace("const PHOTO='assets/webphotos/';",`const PHOTO='assets/webphotos/';const ASSET_MAP=${JSON.stringify(urls)};`);
    html=html.replace('PHOTO+name','ASSET_MAP[PHOTO+name]');
    html=html.replace('assets/pixel/${name}.png',"${ASSET_MAP['assets/pixel/'+name+'.png']}");
    for(const name of ['assets/fonts/GeistPixel.ttf','assets/catatan-impian.jpg','assets/kartu-cita-cita.jpg','assets/kolase-web.png'])html=html.replaceAll(name,urls[name]);
    html=html.replace("history.replaceState(null,'',`#${index+1}`)","try{history.replaceState(null,'',`#${index+1}`)}catch{}");
    frame.srcdoc=html;frame.hidden=false;document.getElementById('login').hidden=true;password.value='';
  }catch(error){message.textContent=error.message==='download'?'Presentasi belum bisa dimuat. Coba lagi.':'Password salah atau presentasi belum bisa dibuka.';password.select()}
  finally{button.disabled=false}
});
</script>
</body>
</html>
